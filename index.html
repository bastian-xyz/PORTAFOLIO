<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>BASTIAN.XYZ</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --negro:    #111827;
  --petroleo: #0F4C5C;
  --plata:    #9CA3AF;
  --blanco:   #F8FAFC;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'Montserrat', sans-serif;
  color:var(--blanco);
  background-color:var(--negro);
  background-image:
    linear-gradient(rgba(15,76,92,.42) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,76,92,.42) 1px, transparent 1px),
    linear-gradient(rgba(15,76,92,.78) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,76,92,.78) 1px, transparent 1px);
  background-size: 8px 8px, 8px 8px, 40px 40px, 40px 40px;
}

/* Canvas Three.js */
#scene-canvas {
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:2;
}

/* Viñeta */
.vignette {
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%, transparent 35%, rgba(0,0,0,.6) 100%);
}

/* Scanline */
.scanline {
  position:fixed; left:0; right:0; top:0;
  height:2px;
  background:linear-gradient(90deg, transparent, rgba(156,163,175,.45), transparent);
  opacity:.6;
  pointer-events:none;
  z-index:4;
  animation:scan 8s linear infinite;
}
@keyframes scan {
  0% { transform:translateY(-10px); }
  100% { transform:translateY(100vh); }
}

/* HUD esquinas */
.hud {
  position:fixed; width:26px; height:26px;
  z-index:6; pointer-events:none;
  border-color:rgba(156,163,175,.35);
  border-style:solid;
}
.hud.tl { top:16px; left:16px;  border-width:1.5px 0 0 1.5px; }
.hud.tr { top:16px; right:16px; border-width:1.5px 1.5px 0 0; }
.hud.bl { bottom:16px; left:16px;  border-width:0 0 1.5px 1.5px; }
.hud.br { bottom:16px; right:16px; border-width:0 1.5px 1.5px 0; }

/* Marca superior */
.brand {
  position:fixed; top:22px; left:30px;
  font-size:clamp(.9rem,1.8vw,1.15rem);
  font-weight:800; letter-spacing:.5px;
  z-index:9; pointer-events:none;
}
.brand span { color:var(--plata); font-weight:300; }

/* Referencia técnica esquina inferior */
.hud-hint {
  position: fixed; bottom: 28px; right: 30px;
  font-size: .54rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(156,163,175,.4); text-align: right;
  z-index:9;
}

/* Contenedor central: objeto + gate */
#gate {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:7;
}

.ref-num {
  font-size:.56rem; font-weight:700;
  letter-spacing:3px; text-transform:uppercase;
  color:rgba(156,163,175,.55); margin-bottom:14px;
  display:flex; align-items:center; gap:10px;
}
.ref-num::before, .ref-num::after { content:''; width:32px; height:1px; background:rgba(156,163,175,.35); }

#gate-title {
  font-size:clamp(1.4rem,4vw,2.2rem);
  font-weight:900; letter-spacing:1px;
  margin-bottom: 46px;
  text-align:center;
  color: var(--blanco);
}
#gate-title span { color: var(--petroleo); }

/* Botón INICIAR */
#btn-iniciar {
  pointer-events:auto;
  position:relative;
  background: rgba(15,76,92,.18);
  border: 1px solid rgba(156,163,175,.4);
  color: var(--blanco);
  font-family:'Montserrat', sans-serif;
  font-size: clamp(.75rem, 1.4vw, .95rem);
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 18px 52px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .3s ease;
  overflow:hidden;
}
#btn-iniciar::before {
  content:'';
  position:absolute; inset:0;
  background: rgba(15,76,92,.5);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .35s ease;
  z-index:-1;
}
#btn-iniciar:hover {
  border-color: var(--blanco);
  letter-spacing: 5px;
}
#btn-iniciar:hover::before { transform: scaleX(1); }

.gate-sub {
  margin-top:20px;
  font-size:.6rem; font-weight:500; letter-spacing:2px; text-transform:uppercase;
  color:rgba(156,163,175,.45);
}

@media (max-width:700px) {
  .brand { font-size:.85rem; }
  .hud-hint { display:none; }
  #gate-title { font-size:1.5rem; margin-bottom:34px; padding:0 20px; }
  #btn-iniciar { padding:16px 40px; letter-spacing:3px; }
}
</style>
</head>
<body>

<canvas id="scene-canvas"></canvas>
<div class="vignette"></div>
<div class="scanline"></div>
<div class="hud tl"></div>
<div class="hud tr"></div>
<div class="hud bl"></div>
<div class="hud br"></div>

<div class="brand">BASTIÁN<span>.XYZ</span></div>
<div class="hud-hint">SYS_STATUS:<br>STANDBY</div>

<div id="gate">
  <div class="ref-num">REF_00 / GATE</div>
  <h1 id="gate-title">Bienvenido a<span>C.I.D.</span> centro de implementación y desarrollo</h1>
  <button id="btn-iniciar">Iniciar</button>
  <div class="gate-sub">vay a entrar o ke?</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

if (typeof THREE === 'undefined') {
  document.getElementById('gate-title').innerHTML = '<span style="color:#ff3333;">[ERROR] Three.js no cargó.</span>';
  return;
}

const canvas = document.getElementById('scene-canvas');
const scene  = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.z = 7;

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

/* --- Iluminación pensada para lectura de METAL MATE ---
   Metal mate = alto metalness, alta roughness (dispersa la luz, sin
   brillos puntuales duros). Se usan varias luces suaves desde ángulos
   distintos en vez de un solo punto especular fuerte. */
scene.add(new THREE.AmbientLight(0x1a2b34, 1.1));

const key = new THREE.DirectionalLight(0xdfe7ec, 1.4);
key.position.set(-6, 5, 6);
scene.add(key);

const fill = new THREE.DirectionalLight(0x0F4C5C, 1.0);
fill.position.set(6, -2, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x9CA3AF, 0.8);
rim.position.set(0, 6, -6);
scene.add(rim);

/* Objeto: icosaedro — misma familia geométrica del portafolio */
const geometry = new THREE.IcosahedronGeometry(2.0, 0);
const material = new THREE.MeshStandardMaterial({
  color: 0x8b93a0,
  metalness: 1.0,
  roughness: 0.55,   // más alto = más "mate", menos brillo especular
  flatShading: true
});
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

/* Wireframe técnico sutil encima, coherente con la estética blueprint */
const edges = new THREE.EdgesGeometry(geometry);
const lineMat = new THREE.LineBasicMaterial({ color: 0x9CA3AF, transparent:true, opacity:0.25 });
const wireframe = new THREE.LineSegments(edges, lineMat);
mesh.add(wireframe);

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  mesh.rotation.x = t * 0.18;
  mesh.rotation.y = t * 0.26;
  renderer.render(scene, camera);
}
animate();

/* Botón INICIAR: por ahora solo placeholder de transición.
   Aquí después conectamos la entrada al portafolio completo. */
document.getElementById('btn-iniciar').addEventListener('click', () => {
  document.getElementById('gate').style.transition = 'opacity .5s ease';
  document.getElementById('gate').style.opacity = '0';
  // TODO: redirigir o revelar el sitio principal aquí
});

})();
</script>
</body>
</html>
